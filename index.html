<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://tashheel.vercel.app/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة تسهيل | الانتقال للموقع الجديد</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      color: #0f172a;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      padding: 40px 32px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
      border: 1.5px solid #e2e8f0;
      max-width: 480px;
      width: 100%;
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: #eff6ff;
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #0f172a;
    }
    p {
      font-size: 14.5px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.7;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    a.btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35);
    }
  </style>
  <script>
    window.location.replace("https://tashheel.vercel.app/");
  </script>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </div>
    <h1>جاري تحويلك إلى منصة تسهيل...</h1>
    <p>تم نقل المنصة بالكامل إلى العنوان الجديد. إذا لم يتم نقلك تلقائياً خلال ثوانٍ، اضغط على الزر أدناه:</p>
    <a href="https://tashheel.vercel.app/" class="btn">
      <span>الانتقال للموقع الجديد</span>
      <span>←</span>
    </a>
  </div>
</body>
</html>
